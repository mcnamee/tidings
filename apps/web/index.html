<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#ffffff" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Tidings" />
    <!-- Blocking on purpose: must run before the stylesheet so tokens resolve under the right theme. -->
    <script src="/theme-init.js"></script>
    <!-- Without JavaScript nothing would ever remove the launch screen. -->
    <noscript><link rel="stylesheet" href="/noscript.css" /></noscript>
    <title>Tidings</title>
  </head>
  <body>
    <!-- Launch screen (TID-059): styled by the render-blocking stylesheet so it paints before any JS.
         src/splash.ts removes it. Keep the mark equal to public/logo.svg. -->
    <div id="splash" class="splash" aria-hidden="true" inert>
      <svg
        class="splash-mark"
        viewBox="4 4 56 56"
        fill="currentColor"
        stroke="currentColor"
        focusable="false"
      >
        <polygon
          points="10.37,16.18 27.31,11.84 30.53,18.14 55.31,11.14 54.89,18.7 34.45,25.14 26.19,52.3 24.65,52.86 17.79,46.98 24.51,23.6 8.69,23.04"
          stroke-width="7.0"
          stroke-linejoin="round"
        />
      </svg>
      <span class="splash-word">Tidings</span>
    </div>
    <div id="root"></div>
    <noscript
      ><p class="noscript">Tidings needs JavaScript to run. Turn it on and reload.</p></noscript
    >
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
