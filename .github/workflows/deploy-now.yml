# Manual production deploy (owner decision 2026-11-17): the same steps as the `deploy` job in
# ci.yml, without waiting for the test suite. Run it only for a commit on main whose CI tests
# have already passed. Actions > Deploy now > Run workflow.
name: Deploy now

on:
  workflow_dispatch:

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install -g npm@11.6.2
      - run: npm ci
      - name: Build the SPA
        run: npm run build -w @tidings/web
      # A failed migration fails this step, which stops the job before the deploy step.
      # Migrations must be backward compatible with the previous Worker version (spec 14.3).
      - name: Apply remote D1 migrations
        uses: cloudflare/wrangler-action@v3.14.1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/worker
          command: d1 migrations apply tidings --remote
      # TID-053: pick the sign-in email secrets that are set in GitHub. wrangler-action fails on a
      # named secret that is empty, so only set ones are listed. Values are never printed.
      - name: Choose Worker secrets to sync
        id: worker-secrets
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          MAGIC_LINK_EMAIL: ${{ secrets.MAGIC_LINK_EMAIL }}
        run: |
          {
            echo 'names<<EOF'
            [ -n "$RESEND_API_KEY" ] && echo RESEND_API_KEY
            [ -n "$MAGIC_LINK_EMAIL" ] && echo MAGIC_LINK_EMAIL
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"
          exit 0
      - name: Deploy the Worker
        uses: cloudflare/wrangler-action@v3.14.1
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          MAGIC_LINK_EMAIL: ${{ secrets.MAGIC_LINK_EMAIL }}
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/worker
          secrets: ${{ steps.worker-secrets.outputs.names }}
          command: deploy
