name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # Match the npm major used to write package-lock.json. npm 10 (bundled with
      # Node 22) mis-reads the optional @tailwindcss/oxide-wasm32-wasi deps.
      - run: npm install -g npm@11.6.2
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
        working-directory: e2e
      - run: npm run test:e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 7
      - run: npm audit --audit-level=high

  # TID-024 AC1: deploy only after the ci job passes, only from main, never for PRs.
  deploy:
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install -g npm@11.6.2
      - run: npm ci
      - name: Build the SPA
        run: npm run build -w @tidings/web
      # A failed migration fails this step, which stops the job before the deploy step.
      # Migrations must be backward compatible with the previous Worker version (spec 14.3).
      - name: Apply remote D1 migrations
        uses: cloudflare/wrangler-action@v3.14.1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/worker
          command: d1 migrations apply tidings --remote
      # TID-053: pick the sign-in email secrets that are set in GitHub. wrangler-action fails on a
      # named secret that is empty, so only set ones are listed. Values are never printed.
      - name: Choose Worker secrets to sync
        id: worker-secrets
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          MAGIC_LINK_EMAIL: ${{ secrets.MAGIC_LINK_EMAIL }}
        run: |
          {
            echo 'names<<EOF'
            [ -n "$RESEND_API_KEY" ] && echo RESEND_API_KEY
            [ -n "$MAGIC_LINK_EMAIL" ] && echo MAGIC_LINK_EMAIL
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"
          exit 0
      - name: Deploy the Worker
        uses: cloudflare/wrangler-action@v3.14.1
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          MAGIC_LINK_EMAIL: ${{ secrets.MAGIC_LINK_EMAIL }}
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/worker
          secrets: ${{ steps.worker-secrets.outputs.names }}
          command: deploy
